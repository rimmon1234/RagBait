services:
  redis:
    image: redis:7-alpine
    container_name: ragbait-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  community-redis:
    image: redis:7-alpine
    container_name: ragbait-community-redis
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --save "" --appendonly no --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
